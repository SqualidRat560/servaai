# /etc/nginx/sites-available/servaai  (certbot --nginx adds the HTTPS server block)
server {
    listen 80;
    listen [::]:80;
    server_name servaai.us www.servaai.us;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;   # Gemini calls can take a few seconds
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        expires 30d;              # file names are content-hashed
        add_header Cache-Control "public, immutable";
    }
}
